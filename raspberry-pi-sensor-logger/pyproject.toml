[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raspberry-pi-sensor-logger"
version = "1.2.0"
description = "MLX90640, 4MZ-HH4 and USB camera logger for Raspberry Pi"
readme = {text = "Raspberry Pi sensor and USB camera logger.", content-type = "text/plain"}
requires-python = ">=3.9"
dependencies = [
    "Adafruit-Blinka>=8.20,<10",
    "adafruit-circuitpython-mlx90640>=1.3,<2",
    "Pillow>=9.1,<13",
    "opencv-python-headless>=4.8,<5; platform_machine != 'aarch64' and platform_machine != 'armv7l' and platform_machine != 'armv6l'",
    "pyserial>=3.5,<4",
]

[project.scripts]
sensor-logger = "sensor_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
