[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "raspberry-pi-sensor-logger"
version = "1.1.0"
description = "MLX90640, 4MZ-HH4 and USB camera logger for Raspberry Pi"
readme = {text = "Raspberry Pi sensor and USB camera logger.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
    "Adafruit-Blinka==9.2.0",
    "adafruit-circuitpython-mlx90640==1.3.9",
    "Pillow==12.3.0",
    "opencv-python-headless>=4.10,<5",
    "pyserial==3.5",
]

[project.scripts]
sensor-logger = "sensor_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
