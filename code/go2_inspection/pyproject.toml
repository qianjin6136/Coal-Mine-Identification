[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-inspection"
version = "0.1.0"
description = "GO2 image and pose ingestion with laptop-side visual inspection"
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.14,<5",
  "ultralytics>=8.3,<9",
]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
]

[tool.setuptools]
packages = ["app", "app.detectors", "app.meters", "app.modules"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
